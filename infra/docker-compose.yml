services:
  token-server:
    build: ./token-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      PORT: "3000"
      # Comma-separated origins allowed for CORS (leave empty to allow all)
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # oauth2-proxy — add this when you build a backend API that needs
  # authentication (e.g. a dashboard, admin panel, or server-side API).
  # It is NOT used for the mobile token exchange above.
